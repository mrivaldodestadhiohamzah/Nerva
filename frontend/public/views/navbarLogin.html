                <a href="#" data-nav-view="dashboard" onclick="loadView('dashboard')" class="nav-link inline-flex h-10 items-center justify-center rounded-full px-3.5 text-center text-sm font-semibold leading-6 text-gray-700 hover:bg-violet-50 hover:text-violet-800 focus:outline-none focus:ring-2 focus:ring-violet-300 transition-all duration-200 lg:px-3 xl:px-3.5 lg:whitespace-nowrap">Dasbor</a>

                    <img id="profile-image" src="" alt="Profil" 
                         class="w-9 h-9 shrink-0 rounded-full border-2 border-gray-300 hover:border-violet-500 transition-colors object-cover">
                    <svg class="w-4 h-4 shrink-0 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                
                <div id="profile-dropdown" class="hidden absolute right-0 top-full mt-4 w-56 max-w-[calc(100vw-1.5rem)] bg-white rounded-xl shadow-lg border border-gray-200 z-[80] overflow-hidden">
                    <div class="py-2">
                        <div class="px-4 py-2 border-b border-gray-100">
                            <p class="text-base font-semibold text-gray-900" id="dropdown-username">Memuat...</p>
                            <p class="text-sm text-gray-500" id="dropdown-email">Memuat...</p>
                        </div>
                        <a href="#" onclick="loadView('account')"
                           class="flex min-h-11 w-full items-center px-4 py-3 text-base font-medium text-gray-700 hover:bg-violet-50 hover:text-violet-800 transition">

    <div id="logout-modal" tabindex="-1" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[9999] flex items-center justify-center p-6" style="position: fixed; inset: 0; align-items: center; justify-content: center; padding: 24px; z-index: 9999;">
        <div class="bg-white rounded-xl shadow-xl w-[calc(100%-32px)] max-w-[560px] max-h-[calc(100vh-48px)] overflow-y-auto" style="width: calc(100% - 32px); max-width: 560px; max-height: calc(100vh - 48px); overflow-y: auto;">
            <div class="p-5 sm:p-6">
                <div class="text-center">
                    <div class="w-16 h-16 mx-auto mb-4 bg-red-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-sign-out-alt text-red-600 text-2xl"></i>
                    </div>
                    <h3 class="text-lg sm:text-xl font-semibold text-gray-900 mb-2">Konfirmasi Keluar</h3>
                    <p class="text-sm sm:text-base leading-relaxed text-gray-600 mb-6">Apakah Anda yakin ingin keluar? Anda perlu masuk kembali untuk mengakses akun.</p>
                    
                    <div class="flex flex-col sm:flex-row gap-3">
                        <button onclick="closeLogoutModal()" 
                                class="flex-1 min-h-11 px-4 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition">
                            Batal
                        </button>
                        <button onclick="handleLogout()" 
                                class="flex-1 min-h-11 px-4 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                            Keluar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateNavbarProfileImage() {
            const navbarProfileImg = document.getElementById('profile-image');
            const dropdownUsername = document.getElementById('dropdown-username');
            const dropdownEmail = document.getElementById('dropdown-email');
            
            if (!navbarProfileImg) return;
            
            const isLoggedIn = sessionStorage.getItem("isLoggedIn") === "true";
            if (!isLoggedIn) return;
            
            try {
                const user = JSON.parse(sessionStorage.getItem("user") || "{}");
                
                if (dropdownUsername && user.name) {
                    dropdownUsername.textContent = user.name;
                }
                if (dropdownEmail && user.email) {
                    dropdownEmail.textContent = user.email;
                }
                
                handleProfileImageDisplay(navbarProfileImg, user);
                
            } catch (error) {
                console.error('Error updating navbar profile:', error);
            }
        }
        
        function handleProfileImageDisplay(imageElement, user) {
            const defaultImage = 'https://via.placeholder.com/150x150/e2e8f0/64748b?text=User';
            
            try {
                if (!user?.img) {
                    imageElement.src = defaultImage;
                    return;
                }

                if (typeof user.img === 'string') {
                    if (user.img.startsWith('http') || user.img.startsWith('data:image/')) {
                        imageElement.src = user.img;
                        return;
                    }
                    
                    if (user.img.startsWith('\\x')) {
                        try {
                            const hexString = user.img.substring(2);
                            const url = hexString.match(/.{2}/g)?.map(hex => String.fromCharCode(parseInt(hex, 16))).join('') || '';
                            if (url.startsWith('http')) {
                                imageElement.src = url;
                                return;
                            }
                        } catch (hexError) {
                            console.error('Error decoding hex string:', hexError);
                        }
                    }
                }

                if (user.img && typeof user.img === 'object' && user.img.data) {
                    const base64String = convertBinaryToBase64(user.img.data);
                    if (base64String) {
                        imageElement.src = base64String;
                        return;
                    }
                }

                imageElement.src = defaultImage;
                
                imageElement.onerror = () => {
                    console.warn('Failed to load profile image, using default');
                    imageElement.src = defaultImage;
                    imageElement.onerror = null; 
                };
                
            } catch (error) {
                console.error('Error displaying profile image:', error);
                imageElement.src = defaultImage;
            }
        }
        
        function convertBinaryToBase64(binaryData) {
            try {
                if (!binaryData) return null;

                let binary = '';
                let bytes;

                if (binaryData instanceof ArrayBuffer) {
                    bytes = new Uint8Array(binaryData);
                } else if (binaryData instanceof Uint8Array) {
                    bytes = binaryData;
                } else if (Array.isArray(binaryData)) {
                    bytes = new Uint8Array(binaryData);
                } else {
                    console.warn('Unknown binary data format:', typeof binaryData);
                    return null;
                }

                const chunkSize = 8192; 
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    const chunk = bytes.subarray(i, Math.min(i + chunkSize, bytes.length));
                    binary += String.fromCharCode.apply(null, chunk);
                }

                return 'data:image/jpeg;base64,' + btoa(binary);
            } catch (error) {
                console.error('Error converting binary to base64:', error);
                return null;
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            updateNavbarProfileImage();
        });
        
        window.addEventListener('storage', function(e) {
            if (e.key === 'user') {
                updateNavbarProfileImage();
            }
        });
        
        window.updateNavbarProfileImage = updateNavbarProfileImage;
    </script>
</body>
