<main class="bg-gray-50 font-sans text-gray-800 min-h-screen w-full m-0 py-5 sm:py-8 px-4 sm:px-8 lg:px-12 xl:py-16">
    <section class="result-card max-w-3xl mx-auto my-4 sm:my-8 bg-white rounded-xl shadow-md overflow-hidden">
        <div class="soft-section-header px-5 sm:px-6 py-4 text-base font-bold">Hasil</div>
        <div class="flex flex-col items-center gap-5 p-5 sm:p-8 md:flex-row md:items-start">
            <div id="donut-container" class="relative mx-auto flex h-28 w-28 shrink-0 items-center justify-center sm:h-32 sm:w-32">
                <div id="percentage" class="text-xl font-bold text-violet-800">0%</div>
            </div>
            <div class="min-w-0 flex-1 text-center md:text-left">
                <h2 id="stress-title" class="text-xl font-semibold mb-1">Rendah</h2>
                <p id="user-input" class="text-gray-700 leading-relaxed break-words">Tidak ada teks yang diberikan.</p>
            </div>
        </div>
    </section>

    <section class="feedback-sections grid grid-cols-1 gap-6 max-w-5xl mx-auto py-6">
        <div class="bg-white rounded-xl border border-gray-300 shadow">
            <h3 class="soft-section-header rounded-t-xl px-4 py-3 text-base font-semibold">Saran</h3>
            <p class="p-4 text-gray-700" id="analysis-text"></p>
        </div>

        <div class="bg-white rounded-xl border border-gray-300 shadow">
            <h3 class="soft-section-header rounded-t-xl px-4 py-3 text-base font-semibold">Rincian Fusion</h3>
            <div id="fusion-summary" class="p-4"></div>
        </div>

        <div class="bg-white rounded-xl border border-gray-300 shadow">
            <h3 class="soft-section-header rounded-t-xl px-4 py-3 text-base font-semibold">Rincian Dynamic Weighting</h3>
            <div id="fusion-details" class="p-4"></div>
        </div>

        <div class="bg-white rounded-xl border border-gray-300 shadow">
            <h3 class="soft-section-header rounded-t-xl px-4 py-3 text-base font-semibold">Rekomendasi Video</h3>
            <div id="video-recommendations" class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4">
                <div class="rounded-lg border border-violet-100 bg-violet-50 p-4 text-sm text-gray-600">
                    Rekomendasi video belum tersedia untuk hasil ini.
                </div>
            </div>
        </div>
    </section>
</main>
