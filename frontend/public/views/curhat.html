<div class="curhat-page bg-white text-gray-900 min-h-screen w-full m-0 px-4 sm:px-6 md:px-8 ">
  <main>
    <div class="curhat-container max-w-3xl mx-auto my-10 sm:my-20 p-4 sm:p-6 md:p-8 bg-white text-center">

      <div id="spinner" class="hidden fixed inset-0 bg-white bg-opacity-75 flex justify-center items-center z-50">
        <img src="/assets/loading.gif" alt="Memuat..." class="w-16 h-16">
      </div>

      <h2 class="text-3xl sm:text-4xl mb-4 font-bold">
        Apa yang kamu <span class="text-violet-600">rasakan</span> hari ini?
      </h2>
      <p class="text-base sm:text-lg text-gray-600 pb-6">
        Ceritakan kepada kami bagaimana perasaan Anda secara sedetail mungkin! Jangan khawatir, data Anda aman dan tidak akan dibagikan dengan siapa pun.
      </p>
      <p class="mx-auto mt-2 mb-2 max-w-2xl rounded-md border border-violet-100 bg-violet-50 px-4 py-3 text-left text-sm sm:text-base text-violet-900">
        Gunakan bahasa Indonesia saat menulis curhat dan usahakan tidak terlalu banyak typo agar hasil analisis lebih akurat.
      </p>
      <form id="curhatForm">
        <textarea
          id="curhatInput"
          placeholder="Tulis curhat Anda di sini"
          class="w-full h-48 sm:h-64 mt-4 p-4 rounded-md border border-gray-300 resize-none text-base sm:text-lg font-sans"
        ></textarea>
        <p id="result" class="mt-4 text-sm sm:text-base text-gray-600"></p>
        <button
          id="submitCurhat"
          type="submit"
          class="mt-4 mb-4 w-full sm:w-auto bg-violet-800 text-white px-8 sm:px-10 py-3 rounded-lg text-lg sm:text-xl hover:bg-gray-800 transition-colors"
        >
          Kirim
        </button>
      </form>
    </div>
  </main>
</div>

<script>
  function logout() {
    sessionStorage.clear();
    location.reload();
  }
</script>
