  <script>
    // Initialize isLoggedIn from sessionStorage to sync with app.js
    let isLoggedIn = sessionStorage.getItem("isLoggedIn") === "true";

    // Function to attach navbar event listeners
    function attachNavbarListeners() {
      const menuToggle = document.getElementById('menu-toggle');
      const navbarMenu = document.getElementById('navbar-menu');

      if (menuToggle && navbarMenu) {
        menuToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          navbarMenu.classList.toggle('hidden');
        });

        navbarMenu.addEventListener('click', (e) => {
          e.stopPropagation();
        });

        document.addEventListener('click', () => {
          if (!navbarMenu.classList.contains('hidden')) {
            navbarMenu.classList.add('hidden');
          }
        });
      }

      document.querySelectorAll('a[onclick*="loadView"]').forEach(link => {
        link.addEventListener('click', (e) => {
          const view = e.target.getAttribute('onclick').match(/'([^']+)'/)?.[1];
          console.log(`loadView called for view: ${view}`);
        });
      });
    }

    // Function to load navbar based on login state
    async function updateNavbar() {
      const navbarContainer = document.getElementById('navbar-container');
      isLoggedIn = sessionStorage.getItem("isLoggedIn") === "true";
      const navbarFile = isLoggedIn ? 'views/navbarLogin.html' : 'views/navbarNotLogin.html';

      try {
        const response = await fetch(navbarFile);
        if (!response.ok) throw new Error('Failed to load navbar');
        const html = await response.text();
        navbarContainer.innerHTML = html;
        attachNavbarListeners();
        
        // Load user data for navbar if logged in
        if (isLoggedIn) {
          await loadUserDataForNavbar();
        }
      } catch (error) {
        console.error('Error loading navbar:', error);
        navbarContainer.innerHTML = '<p>Gagal memuat navigasi</p>';
      }
    }

    // Function to load user data for navbar
    async function loadUserDataForNavbar() {
      const token = sessionStorage.getItem('token');
      if (!token) return;

      try {
        const response = await fetch('/api/auth/profile/navbar', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const result = await response.json();
          currentUser = result.user;
          sessionStorage.setItem('user', JSON.stringify(currentUser));
          updateProfileDisplay();
        } else {
          console.error('Failed to load user data for navbar');
        }
      } catch (error) {
        console.error('Error loading user data for navbar:', error);
      }
    }

    // Function to toggle login state for testing (replace with actual login system)
    function toggleLoginState() {
      isLoggedIn = !isLoggedIn;
      sessionStorage.setItem("isLoggedIn", isLoggedIn.toString());
      updateNavbar();
    }

    // Logout function
    function logout() {
      sessionStorage.removeItem("isLoggedIn");
      sessionStorage.removeItem("user");
      sessionStorage.removeItem("token");
      isLoggedIn = false;
      currentUser = null;
      updateNavbar();
      window.loadView('home');
    }

    // Initial navbar load
    updateNavbar();
  </script>

    let currentUser = null;

    document.addEventListener('DOMContentLoaded', function() {
        initializeNavbar();
        setupEventListeners();
    });

    

    function initializeNavbar() {
        currentUser = getCurrentUser();
        if (currentUser) {
            updateProfileDisplay();
        }
    }

    function setupEventListeners() {
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('profile-dropdown');
            const dropdownBtn = document.getElementById('profile-dropdown-btn');
            
            if (dropdown && !dropdown.contains(event.target) && !dropdownBtn.contains(event.target)) {
                dropdown.classList.add('hidden');
            }
        });

        const menuToggle = document.getElementById('menu-toggle');
        const navbarMenu = document.getElementById('navbar-menu');
        
        if (menuToggle && navbarMenu) {
            menuToggle.addEventListener('click', function() {
                navbarMenu.classList.toggle('hidden');
            });
        }
    }

    function updateProfileDisplay() {
        if (!currentUser) return;

        const profileImg = document.getElementById('profile-image');
        const imageUrl = currentUser.profile_image || defaultUserIcon;
        
        if (profileImg) profileImg.src = imageUrl;

        const dropdownUsername = document.getElementById('dropdown-username');
        const dropdownEmail = document.getElementById('dropdown-email');
        
        if (dropdownUsername) dropdownUsername.textContent = currentUser.name || 'Pengguna Tidak Dikenal';
        if (dropdownEmail) dropdownEmail.textContent = currentUser.email || 'Email tidak tersedia';
    }

    function toggleProfileDropdown() {
        const dropdown = document.getElementById('profile-dropdown');
        if (dropdown) {
            dropdown.classList.toggle('hidden');
        }
    }

    function confirmLogout() {
        const modal = document.getElementById('logout-modal');
        if (modal) {
            modal.classList.remove('hidden');
            modal.focus();
            const navbarMenu = document.getElementById('navbar-menu');
            if (navbarMenu) navbarMenu.classList.add('hidden');
        }
    }

    function closeLogoutModal() {
        const modal = document.getElementById('logout-modal');
        if (modal) {
            modal.classList.add('hidden');
        }
    }

    function handleLogout() {
        closeLogoutModal();
        
        if (typeof logout === 'function') {
            logout();
        } else {
            sessionStorage.removeItem("isLoggedIn");
            sessionStorage.removeItem("user");
            sessionStorage.removeItem("token");
            
            if (typeof loadView === 'function') {
                loadView('login');
            } else {
                window.location.href = '/login';
            }
        }
    }

    function getCurrentUser() {
        const userStr = sessionStorage.getItem('user');
        return userStr ? JSON.parse(userStr) : null;
    }

    document.addEventListener('keydown', function(event) {
        const logoutModal = document.getElementById('logout-modal');
        if (!logoutModal || logoutModal.classList.contains('hidden')) return;

        if (event.key === 'Enter') {
            event.preventDefault();
            handleLogout();
        }

        if (event.key === 'Escape') {
            event.preventDefault();
            closeLogoutModal();
        }
    });

    // Remove duplicate loadView since it's handled in app.js
</script>
