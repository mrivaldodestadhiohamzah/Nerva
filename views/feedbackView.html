<main class="bg-gray-50 font-sans text-gray-800 min-h-screen w-full m-0 py-6 px-4 sm:px-8 lg:px-12">
  <section class="result-card max-w-4xl mx-auto my-6 sm:my-8 bg-white rounded-xl shadow-md overflow-hidden">
    <div class="bg-violet-800 text-white px-6 py-3 text-base font-bold">Hasil Gabungan</div>
    <div class="flex flex-col md:flex-row items-center gap-6 md:gap-8 p-5 sm:p-8">
        <div id="donut-container" class="w-28 h-28 flex items-center justify-center">
        <div id="percentage">0%</div>
      </div>
      <div class="flex-1 text-center md:text-left">
        <h2 id="stress-title" class="text-lg font-semibold mb-1">Tingkat Stres</h2>
        <p id="user-input" class="text-gray-700 mt-4">Tidak ada teks yang diberikan.</p>
      </div>
    </div>
  </section>

  <section class="feedback-sections grid grid-cols-1 gap-6 max-w-5xl mx-auto py-6">
    <div class="bg-white rounded-xl border border-gray-300 shadow">
      <h3 class="bg-violet-800 text-white rounded-t-xl px-4 py-3 text-base font-semibold">Saran</h3>
      <p id="suggestion-text" class="p-4 text-gray-700"></p>
    </div>

    <div class="bg-white rounded-xl border border-gray-300 shadow">
      <h3 class="bg-violet-800 text-white rounded-t-xl px-4 py-3 text-base font-semibold">Rincian Fusion</h3>
      <div id="fusion-summary" class="p-4"></div>
    </div>

    <div class="bg-white rounded-xl border border-gray-300 shadow">
      <h3 class="bg-violet-800 text-white rounded-t-xl px-4 py-3 text-base font-semibold">Rincian Dynamic Weighting</h3>
      <div id="fusion-details" class="p-4"></div>
    </div>

    <div class="bg-white rounded-xl border border-gray-300 shadow">
      <h3 class="bg-violet-800 text-white rounded-t-xl px-4 py-3 text-base font-semibold">Rekomendasi Video</h3>
      <div id="video-recommendations" class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4">
        <div class="rounded-lg border border-violet-100 bg-violet-50 p-4 text-sm text-gray-600">
          Rekomendasi video belum tersedia untuk hasil ini.
        </div>
      </div>
    </div>
  </section>
</main>
